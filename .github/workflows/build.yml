name: Build Container Images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'be/server/**'
      - 'fe/ui/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'be/server/**'
      - 'fe/ui/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect changed build contexts
        id: filter
        if: github.ref_type != 'tag'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'fe/ui/**'
              - '.github/workflows/build.yml'
            server:
              - 'be/server/**'
              - '.github/workflows/build.yml'

  build-fe-ui:
    needs: changes
    if: github.ref_type == 'tag' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: fe/ui/
          file: fe/ui/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nextpt-ui
          cache-to: type=gha,mode=max,scope=nextpt-ui

  build-be-server:
    needs: changes
    if: github.ref_type == 'tag' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: be/server/
          file: be/server/manifest/docker/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nextpt-server
          cache-to: type=gha,mode=max,scope=nextpt-server

  cleanup-development-images:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_suffix: [ui, server]
    steps:
      - name: Keep recent development images
        uses: actions/github-script@v7
        env:
          PACKAGE_NAME: ${{ github.event.repository.name }}-${{ matrix.package_suffix }}
          KEEP_DEVELOPMENT_VERSIONS: '30'
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = process.env.PACKAGE_NAME.toLowerCase();
            const keep = Number(process.env.KEEP_DEVELOPMENT_VERSIONS);
            const user = await github.request('GET /users/{username}', { username: owner });
            const packagePath = user.data.type === 'Organization'
              ? `/orgs/${owner}/packages/container/${packageName}/versions`
              : `/users/${owner}/packages/container/${packageName}/versions`;

            let versions;
            try {
              versions = await github.paginate(`GET ${packagePath}`, { per_page: 100 });
            } catch (error) {
              if (error.status === 404) {
                core.notice(`Package ${packageName} does not exist yet.`);
                return;
              }
              throw error;
            }

            const isRelease = (tags) => tags.includes('edge') || tags.includes('latest') ||
              tags.some((tag) => /^v?\d+(?:\.\d+){0,2}(?:[-+].*)?$/.test(tag));
            const developmentVersions = versions
              .filter((version) => {
                const tags = version.metadata?.container?.tags || [];
                return tags.some((tag) => tag.startsWith('sha-')) && !isRelease(tags);
              })
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));

            for (const version of developmentVersions.slice(keep)) {
              await github.request(`DELETE ${packagePath}/{package_version_id}`, {
                package_version_id: version.id,
              });
              core.info(`Deleted ${packageName} version ${version.id}.`);
            }
